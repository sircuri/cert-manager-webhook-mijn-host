apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mijn-host-webhook.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mijn-host-webhook.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mijn-host-webhook.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mijn-host-webhook.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "mijn-host-webhook.serviceAccountName" . }}
      containers:
        - name: webhook
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
          env:
            - name: GROUP_NAME
              value: {{ .Values.groupName | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MIJN_HOST_OWN_ACME_RECORDS
              value: {{ .Values.zone.ownAcmeRecords | quote }}
            - name: MIJN_HOST_SWEEP_INTERVAL
              value: {{ .Values.zone.sweepInterval | quote }}
            - name: MIJN_HOST_MAX_RECORD_AGE
              value: {{ .Values.zone.maxRecordAge | quote }}
            - name: MIJN_HOST_LOCK_WAIT_TIMEOUT
              value: {{ .Values.zone.lockWaitTimeout | quote }}
            - name: MIJN_HOST_LOCK_DURATION
              value: {{ .Values.zone.lockDuration | quote }}
            - name: MIJN_HOST_TRIGGER_CONTEXT
              value: {{ .Values.triggerContext.enabled | quote }}
          ports:
            - name: https
              containerPort: 443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            {{- with .Values.livenessProbe }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            {{- with .Values.readinessProbe }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tls
          secret:
            secretName: {{ include "mijn-host-webhook.servingCertName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
